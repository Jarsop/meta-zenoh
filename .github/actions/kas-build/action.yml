name: "Build Zenoh Recipes"
description: "Build all Zenoh recipes using kas (shm enabled, both backends)"

inputs:
  force_rebuild:
    description: "Force full rebuild (ignore cache)"
    required: false
    default: "false"
  kas_config:
    description: "Colon-separated kas config files applied to every checkout and build"
    required: false
    default: "kas/ci.yml:kas/shared-memory.yml:kas/unstable-api.yml"

runs:
  using: composite
  steps:
    - name: Install kas
      id: kas
      shell: bash
      run: |
        wget -q https://github.com/siemens/kas/raw/5.0/kas-container -O /tmp/kas
        chmod +x /tmp/kas
        echo "KAS=/tmp/kas" >> "${GITHUB_OUTPUT}"

    - name: Checkout with kas
      shell: bash
      run: |
        ${{ steps.kas.outputs.KAS }} checkout ${{ inputs.kas_config }}

    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        build-mount-path: "${{ github.workspace }}/build"
        root-reserve-mb: 30000
        temp-reserve-mb: 8000
        swap-size-mb: 2048
        remove-dotnet: "true"
        remove-android: "true"
        remove-haskell: "true"
        remove-codeql: "true"

    # Cache keys. A saved key is never overwritten, so every run saves under its own key
    # and restores the newest one of its branch. The branch is the one the run belongs
    # to, or the base branch of a pull request.
    - name: Cache keys
      id: keys
      shell: bash
      env:
        BRANCH: ${{ github.base_ref || github.ref_name }}
        LOCK: ${{ hashFiles('kas/ci.lock.yml') }}
        RUN: ${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        {
          echo "sstate_branch=yocto-sstate-$BRANCH-"
          echo "sstate_lock=yocto-sstate-$BRANCH-$LOCK-"
          echo "sstate=yocto-sstate-$BRANCH-$LOCK-$RUN"
          echo "downloads_branch=yocto-downloads-$BRANCH-"
          echo "downloads=yocto-downloads-$BRANCH-$RUN"
        } >> "${GITHUB_OUTPUT}"

    - name: Restore sstate cache
      if: ${{ inputs.force_rebuild != 'true' }}
      uses: actions/cache/restore@v4
      with:
        path: build/sstate-cache
        key: ${{ steps.keys.outputs.sstate }}
        restore-keys: |
          ${{ steps.keys.outputs.sstate_lock }}
          ${{ steps.keys.outputs.sstate_branch }}

    - name: Restore downloads cache
      uses: actions/cache/restore@v4
      with:
        path: build/downloads
        key: ${{ steps.keys.outputs.downloads }}
        restore-keys: |
          ${{ steps.keys.outputs.downloads_branch }}
          yocto-downloads-

    # From here on the cache directories hold at least what was restored: they are saved
    # whatever happens to the build. A pull request saves nothing: its caches would be
    # readable by that pull request only.
    - name: Caches are ready to be saved
      id: restored
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
      run: |
        mkdir -p build/sstate-cache build/downloads
        if [ "$EVENT" != pull_request ]; then
          echo "save=true" >> "${GITHUB_OUTPUT}"
        fi

    - name: Build zenoh and zenoh-c (Rust backend)
      shell: bash
      run: |
        ${{ steps.kas.outputs.KAS }} build ${{ inputs.kas_config }} -- zenoh zenoh-c python3-eclipse-zenoh

    - name: Build zenoh-pico
      shell: bash
      run: |
        ${{ steps.kas.outputs.KAS }} build ${{ inputs.kas_config }} -- zenoh-pico

    - name: Build zenoh-cpp with zenoh-c backend
      shell: bash
      run: |
        ${{ steps.kas.outputs.KAS }} build ${{ inputs.kas_config }}:kas/zenoh-c-backend.yml -- zenoh-cpp

    - name: Build zenoh-cpp with zenoh-pico backend
      shell: bash
      run: |
        ${{ steps.kas.outputs.KAS }} build ${{ inputs.kas_config }}:kas/zenoh-pico-backend.yml -- zenoh-cpp

    - name: Upload fetch failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: do_fetch-logs
        if-no-files-found: ignore
        retention-days: 7
        path: |
          build/tmp/work/*/*/*/temp/log.do_fetch.*
          build/tmp/work/*/*/temp/log.do_fetch.*

    - name: Clean sstate duplicates
      if: ${{ always() && steps.restored.outputs.save == 'true' }}
      shell: bash
      run: |
        SSTATE_SCRIPT=$(find layers -maxdepth 3 -path '*/scripts/sstate-cache-management.py' -print -quit)
        if [ -f "${SSTATE_SCRIPT}" ]; then
          echo "Cleaning sstate duplicates..."
          python3 "${SSTATE_SCRIPT}" --remove-duplicated --cache-dir=build/sstate-cache -y || true
        fi

    - name: Save sstate cache
      id: save_sstate
      if: ${{ always() && steps.restored.outputs.save == 'true' }}
      uses: actions/cache/save@v4
      with:
        path: build/sstate-cache
        key: ${{ steps.keys.outputs.sstate }}

    - name: Save downloads cache
      id: save_downloads
      if: ${{ always() && steps.restored.outputs.save == 'true' }}
      uses: actions/cache/save@v4
      with:
        path: build/downloads
        key: ${{ steps.keys.outputs.downloads }}

    # One sstate and one downloads cache per branch: all caches of the repository share
    # one size limit. Needs GH_TOKEN with `actions: write` in the job.
    - name: Delete the caches this run replaced
      if: ${{ always() && steps.restored.outputs.save == 'true' }}
      shell: bash
      env:
        SSTATE_SAVED: ${{ steps.save_sstate.outcome == 'success' && steps.keys.outputs.sstate || '' }}
        SSTATE_PREFIX: ${{ steps.keys.outputs.sstate_branch }}
        DOWNLOADS_SAVED: ${{ steps.save_downloads.outcome == 'success' && steps.keys.outputs.downloads || '' }}
        DOWNLOADS_PREFIX: ${{ steps.keys.outputs.downloads_branch }}
      run: |
        replaced() { # replaced <key prefix> <key just saved>: delete the other keys of this ref
          [ -n "$2" ] || return 0
          gh cache list --ref "$GITHUB_REF" --key "$1" --limit 100 --json id,key \
              --jq '.[] | "\(.id)\t\(.key)"' |
            while IFS=$'\t' read -r id key; do
              if [ "$key" != "$2" ]; then
                echo "Deleting $key"
                gh cache delete "$id" || true
              fi
            done
        }
        replaced "$SSTATE_PREFIX" "$SSTATE_SAVED"
        replaced "$DOWNLOADS_PREFIX" "$DOWNLOADS_SAVED"

    - name: List built RPMs and native components
      shell: bash
      run: |
        echo "=== Built RPM packages ==="
        find build/tmp/deploy/rpm -name '*zenoh*.rpm' \
          -exec echo -e "\n=== {} ===" \; \
          -exec rpm -qp --queryformat "[%-20{=NAME} %{FILENAMES}\n]" {} \; 2>/dev/null || echo "No RPMs found"

        echo -e "\n=== Native sysroot components ==="
        find build/tmp/sysroots-components/x86_64 \
          -maxdepth 1 -type d -name 'zenoh*-native' \
          -exec echo -e "\n=== {} ===" \; \
          -exec tree -L 2 -I sysroot-providers {} \; 2>/dev/null || echo "No native components found"
